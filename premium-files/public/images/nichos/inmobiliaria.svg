<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="mainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:##6A1B9A;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:##AB47BC;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="overlayGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:0"/>
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.4"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="spotlight" cx="30%" cy="30%" r="60%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="url(#mainGrad)"/>
  
  <!-- Geometric patterns -->
  <circle cx="650" cy="100" r="200" fill="#ffffff" opacity="0.05"/>
  <circle cx="150" cy="500" r="150" fill="#ffffff" opacity="0.05"/>
  <circle cx="700" cy="450" r="100" fill="#3BCEAC" opacity="0.08"/>
  
  <!-- Decorative lines -->
  <line x1="0" y1="100" x2="300" y2="0" stroke="#ffffff" stroke-width="1" opacity="0.1"/>
  <line x1="0" y1="200" x2="500" y2="0" stroke="#ffffff" stroke-width="0.5" opacity="0.08"/>
  <line x1="500" y1="600" x2="800" y2="400" stroke="#ffffff" stroke-width="1" opacity="0.1"/>
  
  <!-- Overlay -->
  <rect width="800" height="600" fill="url(#overlayGrad)"/>
  <rect width="800" height="600" fill="url(#spotlight)"/>
  
  <!-- Icon circle -->
  <circle cx="400" cy="240" r="60" fill="#ffffff" opacity="0.15"/>
  <circle cx="400" cy="240" r="45" fill="#ffffff" opacity="0.1"/>
  
  <!-- Icon -->
  <text x="400" y="255" font-family="Arial,sans-serif" font-size="52" fill="#ffffff" text-anchor="middle" filter="url(#glow)">🏠</text>
  
  <!-- Title -->
  <text x="400" y="360" font-family="Arial,sans-serif" font-size="36" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="2">Inmobiliarias</text>
  
  <!-- Subtitle -->
  <text x="400" y="395" font-family="Arial,sans-serif" font-size="16" fill="#ffffff" text-anchor="middle" opacity="0.8" letter-spacing="1">Propiedades Inteligentes</text>
  
  <!-- Accent line -->
  <rect x="350" y="420" width="100" height="3" fill="#3BCEAC" rx="1.5"/>
  
  <!-- Brand -->
  <text x="400" y="520" font-family="Arial,sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" opacity="0.4" letter-spacing="3">WINTECH AI</text>
</svg>